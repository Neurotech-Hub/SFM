name: base-station (hardware-free subset)

on:
  push:
    branches: [main]
    paths:
      - "packages/dev_gui/**"
      - "packages/sfm-analysis/**"
      - ".github/workflows/base-station.yml"
  pull_request:
    paths:
      - "packages/dev_gui/**"
      - "packages/sfm-analysis/**"
      - ".github/workflows/base-station.yml"
  workflow_dispatch:

concurrency:
  group: base-station-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subset:
    # Runs only the base-station tests that need no display and no
    # RPi-only hardware library (dearpygui / RPi.GPIO / gpiod). dearpygui is
    # imported only by base_station/app.py, and the GPIO libraries only inside
    # IOManager.begin(), so the engine (base_station/engine.py) and everything
    # else is importable and testable on a plain Linux runner.
    # The remaining tests (test_app.py, test_app_pellet_counting.py,
    # test_schedule.py, test_hat.py) need dearpygui or a Pi and run manually —
    # see packages/dev_gui/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/sfm-analysis pytest python-can aiohttp
      - name: syntax-check everything, including the GUI modules we cannot import
        run: python -m compileall -q packages/dev_gui/base_station packages/dev_gui/*.py
      - name: run the hardware-free base-station tests
        working-directory: packages/dev_gui
        run: |
          pytest -q \
            tests/test_protocol.py tests/test_log_manager.py \
            tests/test_behavioral_log_names.py tests/test_node_registry.py \
            tests/test_pellet_ledger.py tests/test_mac_id_registry.py \
            tests/test_discovery_manager.py tests/test_experiment.py \
            tests/test_experiment_schema.py tests/test_script.py \
            tests/test_two_armed_bandit.py tests/test_engine.py \
            tests/test_io_manager.py tests/test_bnc_input.py \
            tests/test_bnc_output.py tests/test_bnc_settings.py \
            tests/test_bench_stats.py tests/test_troubleshooting.py \
            tests/test_host.py tests/test_commands.py \
            tests/test_experiment_form.py tests/test_process_lock.py \
            tests/test_service.py tests/test_gateway.py \
            tests/test_node_layout.py tests/test_gui_settings.py tests/test_ui_browser.py \
            tests/test_kiosk.py tests/test_deploy.py tests/test_load_monitor.py
