name: sfm-analysis

on:
  push:
    branches: [main]
    paths:
      - "packages/sfm-analysis/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "packages/sfm-analysis/**"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # macos-latest is Apple Silicon; actions/setup-python has no
          # 3.9 build for arm64. Covered separately via macos-13 below.
          - os: macos-latest
            python-version: "3.9"
        include:
          - os: macos-13
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/sfm-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: console script smoke
        run: sfm-report --list-designs
      - name: demo report renders with no rig or log dir
        run: sfm-report --demo --out demo_report.html --quiet
      - name: demo report + interactive explorer, cross-linked
        run: sfm-report --demo --explorer --out demo_report2.html --quiet

  build:
    name: wheel + sdist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sfm-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: the 5 design JSONs and the demo CSVs must actually be inside the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          jsons = [n for n in names
                   if n.startswith("sfm_analysis/report/designs/") and n.endswith(".json")]
          assert len(jsons) == 5, (whl, jsons)
          demo_csvs = [n for n in names
                       if n.startswith("sfm_analysis/report/demo/") and n.endswith(".csv")]
          assert len(demo_csvs) == 2, (whl, demo_csvs)
          print("ok:", jsons, demo_csvs)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/sfm-analysis/dist/

  install-from-git:
    name: pip install git+...#subdirectory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install into a clean env straight from GitHub
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          REPO="${{ github.event.pull_request.head.repo.full_name || github.repository }}"
          pip install "git+https://github.com/${REPO}.git@${SHA}#subdirectory=packages/sfm-analysis"
      - run: python -c "import sfm_analysis; print(sfm_analysis.__version__)"
      - run: sfm-report --list-designs
